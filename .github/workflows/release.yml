name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
            fetch-script: powershell -ExecutionPolicy Bypass -File scripts/fetch-aria2.ps1
          - platform: macos-latest
            target: aarch64-apple-darwin
            fetch-script: |
              brew install aria2
              bash scripts/fetch-aria2.sh
          - platform: macos-13
            target: x86_64-apple-darwin
            fetch-script: |
              brew install aria2
              bash scripts/fetch-aria2.sh
          - platform: ubuntu-22.04
            target: ''
            fetch-script: |
              sudo apt-get update
              sudo apt-get install -y aria2
              bash scripts/fetch-aria2.sh

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch aria2c binary
        shell: bash
        run: ${{ matrix.fetch-script }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AriaPanel ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
